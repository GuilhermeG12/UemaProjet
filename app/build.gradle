plugins { id 'com.android.application' }

android {
    namespace 'br.uema.estudos'
    compileSdk 34
    defaultConfig {
        applicationId 'br.uema.estudos'
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName '1.3'
    }
    buildTypes {
        release {
            minifyEnabled false
            // assina com a chave de debug para poder instalar direto no celular
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

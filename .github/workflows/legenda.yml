name: Baixar legenda do vídeo
on:
  workflow_dispatch:
    inputs:
      video: { description: 'Link do YouTube', required: true, default: 'https://youtu.be/Mb78gXG5bBU' }
  push:
    paths: ['.github/workflows/legenda.yml']
jobs:
  legenda:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q yt-dlp
      - name: Baixar legenda (manual ou automática, em português)
        env:
          VIDEO: ${{ github.event.inputs.video || 'https://youtu.be/Mb78gXG5bBU' }}
        run: |
          yt-dlp --print "TITULO: %(title)s | CANAL: %(channel)s | DURACAO: %(duration_string)s" --skip-download "$VIDEO" || true
          yt-dlp --skip-download --write-subs --write-auto-subs --sub-langs 'pt.*,pt' --sub-format vtt --convert-subs srt -o 'legenda' "$VIDEO" || true
          ls -la
      - name: Mostrar texto da legenda
        run: |
          f=$(ls legenda*.srt 2>/dev/null | head -1)
          if [ -z "$f" ]; then echo "SEM LEGENDA"; exit 0; fi
          echo "ARQUIVO: $f"
          grep -v -E '^[0-9]+$|-->|^\s*$' "$f" | awk '!seen[$0]++' | tr '\n' ' ' | fold -w 400
      - uses: actions/upload-artifact@v4
        with: { name: legenda, path: 'legenda*', if-no-files-found: ignore }

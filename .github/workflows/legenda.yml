name: Baixar legenda do vídeo
on:
  workflow_dispatch:
    inputs:
      video: { description: 'ID do vídeo do YouTube', required: true, default: 'Mb78gXG5bBU' }
  push:
    paths: ['.github/workflows/legenda.yml']
jobs:
  legenda:
    runs-on: ubuntu-latest
    env:
      VID: ${{ github.event.inputs.video || 'Mb78gXG5bBU' }}
    steps:
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: pip install -q -U "yt-dlp[default]" youtube-transcript-api
      - name: 1) youtube-transcript-api
        continue-on-error: true
        run: |
          python - <<'EOF'
          import os
          from youtube_transcript_api import YouTubeTranscriptApi
          api = YouTubeTranscriptApi()
          t = api.fetch(os.environ['VID'], languages=['pt', 'pt-BR', 'pt-PT'])
          open('legenda.txt', 'w').write(' '.join(s.text for s in t))
          print('OK transcript-api')
          EOF
      - name: 2) yt-dlp com vários clientes
        continue-on-error: true
        run: |
          [ -s legenda.txt ] && exit 0
          for c in tv web_safari mweb ios android_vr web_embedded; do
            echo "== cliente $c"
            yt-dlp --extractor-args "youtube:player_client=$c" --skip-download --write-subs --write-auto-subs \
              --sub-langs 'pt.*,pt' --sub-format vtt --convert-subs srt -o 'leg' \
              --print "TITULO: %(title)s | CANAL: %(channel)s | DURACAO: %(duration_string)s" --no-simulate \
              "https://www.youtube.com/watch?v=$VID" && ls leg*.srt 2>/dev/null && break
          done
          f=$(ls leg*.srt 2>/dev/null | head -1)
          [ -n "$f" ] && grep -v -E '^[0-9]+$|-->|^\s*$' "$f" | awk '!seen[$0]++' | tr '\n' ' ' > legenda.txt
      - name: 3) áudio + Whisper (se não houver legenda)
        continue-on-error: true
        run: |
          [ -s legenda.txt ] && exit 0
          for c in tv web_safari mweb ios android_vr; do
            yt-dlp --extractor-args "youtube:player_client=$c" -f 'ba/b' -x --audio-format mp3 -o 'audio.%(ext)s' \
              "https://www.youtube.com/watch?v=$VID" && break
          done
          [ -f audio.mp3 ] || exit 1
          pip install -q faster-whisper
          python - <<'EOF'
          from faster_whisper import WhisperModel
          m = WhisperModel('small', device='cpu', compute_type='int8')
          segs, _ = m.transcribe('audio.mp3', language='pt')
          open('legenda.txt', 'w').write(' '.join(s.text.strip() for s in segs))
          print('OK whisper')
          EOF
      - name: Resultado
        run: |
          if [ -s legenda.txt ]; then echo "=== TRANSCRICAO ==="; fold -s -w 300 legenda.txt; else echo "SEM TRANSCRICAO"; fi
      - uses: actions/upload-artifact@v4
        with: { name: legenda, path: legenda.txt, if-no-files-found: ignore }
